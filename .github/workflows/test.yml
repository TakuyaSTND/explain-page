name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.deps }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        deps: [full]
        include:
          # 任意の部品（Pillow・Playwright）が無い人が試験を回しても落ちないことを確かめる
          - os: ubuntu-latest
            deps: minimal
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: matrix.deps == 'full'
        with:
          node-version: "20"
      - name: optional dependencies (Pillow, Playwright)
        if: matrix.deps == 'full'
        shell: bash
        run: |
          python -m pip install pillow
          npx -y playwright install --with-deps chromium
      - name: unit tests
        run: python -m unittest discover -s .claude/hooks/tests -v
      - name: plugin build check
        run: python .claude/scripts/build_plugin.py --check
      - name: render the examples
        if: matrix.deps == 'full'
        shell: bash
        run: |
          python .claude/scripts/render_page.py examples/minimal_note.json
          python .claude/scripts/render_page.py examples/reading_tracker_cache.json
